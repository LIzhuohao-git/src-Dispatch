# Global EKF for map-frame localization with ArUco corrections.
#
# TF ownership:
#   - originbot_base publishes odom -> base_footprint (pub_odom:=true)
#   - this node fuses odom/imu/aruco and outputs /odometry/filtered in map frame
#   - map_to_odom broadcasts map -> odom from this output
#   - AMCL must NOT be running when this stack is used
ekf_map_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false
    debug_out_file: /tmp/ekf_map_debug.txt
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: true
    odom0_relative: false
    odom0_pose_rejection_threshold: 20.0
    odom0_twist_rejection_threshold: 1.542

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_pose_rejection_threshold: 20.0
    imu0_twist_rejection_threshold: 1.542
    imu0_linear_acceleration_rejection_threshold: 10.0
    imu0_remove_gravitational_acceleration: true

    pose0: /aruco/pose
    pose0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_queue_size: 10
    pose0_nodelay: true
    pose0_differential: false
    pose0_relative: false
    pose0_pose_rejection_threshold: 100.0

